limit_count: 0
notes: >-
  Atom publishes no API rate limits. The Customers API and the WhatsApp
  Templates API articles in the provider knowledge base document headers, body
  fields and auth but state no quota, no per-minute/per-hour ceiling, no burst
  allowance and no 429 behaviour. The one "limits" page Atom does publish
  (limites-y-tipos-de-archivos-soportados) covers attachment file sizes and
  supported media types in the messaging product, not API request rates, so it
  is not recorded as a rate limit. Live unauthenticated probes of the API host
  on 2026-08-14 returned 401 with no RateLimit-*, X-RateLimit-* or Retry-After
  headers on the response - only Google Cloud Functions infrastructure headers.
  An honest zero: an integrator cannot learn Atom's throughput ceiling from any
  public source.
