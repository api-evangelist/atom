notes: >-
  Atom publishes NO AsyncAPI document. It does publish a real webhook surface,
  documented in the Spanish knowledge base as the integration path for CRMs that
  have no native Atom connector (Zoho, Seekop, in-house systems). The direction
  matters and is recorded precisely: Atom's documented webhook is INBOUND - an
  external system calls an Atom webhook URL to trigger a predefined Atom flow.
  No outbound event catalogue (message received, conversation assigned, lead
  qualified) with subscribable event types and payload schemas was found in
  public documentation. Event names, payload schemas and delivery/retry
  semantics are not published, so none are recorded.
direction: inbound
webhooks:
- name: flow-trigger
  direction: inbound
  description: >-
    An external CRM/ERP calls a configured Atom webhook URL to execute a
    predefined Atom flow (for example to start a WhatsApp conversation or send a
    template when a record changes in the calling system).
  configuration: >-
    Created in the Atom flow editor by choosing the Webhook trigger option when
    building a predefined flow; the caller configures the Atom webhook URL and
    its parameters.
  authentication:
    required: true
    type: api-token
    note: >-
      An API Token is mandatory for webhook-triggered flows, generated in
      Configuracion > Mi Empresa > Configuraciones under the security settings.
  payload_schema: null
  source: https://soporte.atomchat.io/knowledge/c%C3%B3mo-integrar-atom-con-crm-no-nativos-o-desarrollos-propios
