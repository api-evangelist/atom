notes: >-
  Atom ships NO MCP server. Searched the provider website, the Spanish knowledge
  base, npm (@modelcontextprotocol and atomchat namespaces), and the public MCP
  registries; nothing first-party exists, and mcp.atomchat.io does not resolve
  (DNS NXDOMAIN, probed 2026-08-14). A third-party no-code platform (viaSocket)
  advertises an "MCP server for AtomChat AI", but that is a vendor-built
  wrapper, not an Atom-published surface, and it is deliberately NOT recorded as
  Atom's. The tools below are a CANDIDATE list derived from the three
  operations Atom genuinely documents; they describe what an MCP server for Atom
  would expose, not something that exists. No MCPServer pointer is wired into
  apis.yml, because that pointer asserts the provider serves an agent surface
  and Atom does not. Input schemas are partial: Atom publishes no OpenAPI, so
  parameter types and required/optional status cannot be established for the
  Customers API without authenticated access.
