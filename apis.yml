name: ATOM
description: Atom (atomchat.io) is a Panama-based conversational-commerce platform whose
  multimodal AI Agents combine text, voice, image, and CRM data to run human-like WhatsApp
  conversations that qualify leads and close sales for businesses across Latin America.
  Founded in 2019 by Erick Holmann and Rene Mouynes and backed by Techstars and Mucker
  Capital, Atom connects WhatsApp click-to-chat ads to an AI agent that engages and
  qualifies prospects, then hands sales-ready leads to human reps. It exposes a Customers
  API and a WhatsApp template-message API, both authenticated with an account API key
  configured from the Atom admin panel.
