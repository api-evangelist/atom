- aid: atom:templates
  name: Atom WhatsApp Templates API
  description: >-
    REST service for sending pre-approved WhatsApp template messages from an
    account's official WhatsApp number. The documented send endpoint is
    POST /api/Template/SendMessage, taking templateId, phoneNumber, clientName,
    groupName, an assign flag and a params object of template variables; a
    /templates endpoint exposes the account's templates. Requests carry
    Content-type application/json and an Authorization Bearer token. When the
    number is already in an open conversation the message is delivered
    immediately, otherwise confirmation is awaited from the official WhatsApp
    provider. No OpenAPI is published for this API.
  humanURL: https://soporte.atomchat.io/knowledge/como-enviar-templates-messages-utilizando-la-api-de-atomchat
  baseURL: https://us-central1-atomchat-io.cloudfunctions.net
