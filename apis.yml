apis:
- aid: atom:customers
  name: Atom Customers API
  description: >-
    REST service for managing the customer (cliente) records behind Atom's
    WhatsApp conversations. The provider knowledge base documents three
    operations: create or update a customer, retrieve the list of all customers
    with required and optional parameters, and retrieve a single customer's
    details by ID. Requests are authenticated with an account bearer token
    issued from the Atom admin panel and sent in the Authorization header. It is
    the documented integration path for CRMs and in-house systems that have no
    native Atom connector. No OpenAPI is published for this API.
  humanURL: https://soporte.atomchat.io/knowledge/api-de-clientes
  baseURL: https://us-central1-atomchat-io.cloudfunctions.net
  tags:
  - Customers
  - CRM
  - Messaging
  - WhatsApp
