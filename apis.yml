x-enrichment-notes:
  unpointered_artifacts:
  - file: well-known/atom-well-known.yml
    reason: recorded absence, no pointer emitted (see below)
  - file: mcp/atom-mcp.yml
    reason: derived candidate only, no server exists (see below)
  pointers_deliberately_withheld:
  - type: WellKnown
    reason: >-
      Every /.well-known/* path 404s on atomchat.io and on the API host. The two
      200s observed are an SPA catch-all (app.atomchat.io) and Intercom's own
      security.txt on the help-centre host. Nothing is a document Atom
      publishes, so the probe is recorded under a non-scoring type and no
      WellKnown/SecurityTxt pointer is wired.
  - type: MCPServer
    reason: >-
      mcp/atom-mcp.yml is a derived CANDIDATE with deployment.mode none. Atom
      ships no MCP server, hosted or stdio; the only "AtomChat MCP server" found
      is a third-party viaSocket wrapper.
  - type: AgentCard
    reason: >-
      /.well-known/agent-card.json and /.well-known/agent.json 404 on every real
      host. Never generated - search only.
  - type: Idempotency
    reason: >-
      Atom documents no idempotency key or safe-retry contract on any surface,
      including the WhatsApp template send.
  - type: SDKs
    reason: >-
      Zero first-party client libraries in any public registry; packages
      artifact records an honest zero.
  - type: Security
    reason: >-
      No vulnerability-disclosure channel, no security contact and no bug bounty.
      The published information security policy is an internal employee policy
      last updated 2023-04-02.
  - type: Compliance
    reason: >-
      Atom names no certification of its own. Firebase's ISO 27001 is Google's,
      recorded as infrastructure context only.
  - type: StatusPage
    reason: status.atomchat.io does not resolve; /status returns 404.
  - type: Deprecation
    reason: No deprecation policy or Sunset header support published.
  - type: ChangeLog
    reason: >-
      No API changelog. App-store release notes describe the Atom mobile app,
      not the API.
