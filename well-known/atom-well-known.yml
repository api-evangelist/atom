generated: '2026-08-14'
method: probed
source: >-
  Live probes of /.well-known/* on every Atom host known to the profile,
  2026-08-14
hosts_probed:
- https://atomchat.io
- https://us-central1-atomchat-io.cloudfunctions.net
- https://app.atomchat.io
- https://soporte.atomchat.io
notes: >-
  Atom serves NO /.well-known discovery surface of its own. Every standard
  document returns 404 on the marketing host (atomchat.io) and on the API host
  (us-central1-atomchat-io.cloudfunctions.net). Two 200s were observed and BOTH
  are false positives, recorded here explicitly so a later round does not credit
  them: (1) app.atomchat.io answers HTTP 200 to every path, including
  /openapi.json and /llms.txt, with the Angular SPA HTML shell (title "Atom",
  data-beasties-container) - a catch-all route, not a document; (2)
  soporte.atomchat.io serves a real text/plain security.txt, but it is
  Intercom's, not Atom's - the body reads "Intercom - reporting security
  vulnerabilities to Intercom", Contact: https://bugcrowd.com/intercom, and
  Canonical: https://app.intercom.com/.well-known/security.txt. Atom's help
  centre is a white-labelled Intercom deployment, so that document belongs to the
  SaaS vendor. No WellKnown, SecurityTxt or Security pointer is wired in
  apis.yml, because nothing here is a document Atom publishes.
